name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pip-audit
      - run: pip install -e .
      - run: pytest tests/test_security.py -v
      - run: pip-audit --strict --desc
      - name: No subprocess or shell
        run: "! grep -rn 'subprocess\\|os\\.system\\|shell=True' src/"
      - name: No plain http
        run: "! grep -rn 'http://' src/ | grep -v localhost | grep -v '127\\.0\\.0\\.1'"
      - name: No credential logging
        run: "! grep -rni 'password\\|api_key\\|secret\\|token' src/ | grep -i 'log\\|print'"

  publish:
    needs: security
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
