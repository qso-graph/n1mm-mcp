[project]
name = "n1mm-mcp"
version = "0.3.2"
description = "MCP server for N1MM Logger+ — live contest state via UDP broadcast"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0,<5",
    "defusedxml>=0.7.1",
]
keywords = [
    "amateur-radio", "ham-radio", "mcp", "model-context-protocol",
    "n1mm", "contest", "contesting", "logging", "udp",
    "dx", "dxpedition", "so2r", "propagation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/n1mm-mcp/"
Repository = "https://github.com/qso-graph/n1mm-mcp"
Issues = "https://github.com/qso-graph/n1mm-mcp/issues"

[project.scripts]
n1mm-mcp = "n1mm_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n1mm_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. It was deferred (qso-graph-devel#70) because the rules that find defects
# went in first and this one waited. That pass is done here (#28). E501 reported
# 31 lines in this repo and not one of them was a defect, which is the finding
# rather than an argument against enforcing it. No line needed an exemption.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
